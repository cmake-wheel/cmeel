name: Test metadata

on:
  push:
    branches:
      - cmeel
  pull_request:
    branches:
      - cmeel

jobs:
  test:
    name: Test metadata
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0

      - name: test metadata
        run: uv run cmeel metadata | grep -q "# CMake Wheel: cmeel"
      - name: test metadata dist
        run: uv run cmeel metadata --dist | grep -q cmeel-
